<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الجودة والتحقق من متطلبات والاشتراطات اللازمة للمخالفات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جودة المخالفات">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D4C73">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#EEF3F6;--paper:#FFFFFF;--ink:#0B2A3F;--muted:#58707F;--line:#D5E0E8;
  --bar:#0D4C73;--onbar:#FFFFFF;--water:#1C7FC4;--tide:#12A3A8;--soft:#E2EEF6;
  --ok:#1E7F52;--okbg:#E2F3EA;--bad:#B8392F;--badbg:#FBE8E5;--warn:#9A6512;--warnbg:#FFF2D9;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#091823;--paper:#0F2636;--ink:#E4EEF4;--muted:#93ABBB;--line:#22465E;
  --bar:#0B3450;--onbar:#EAF4FA;--water:#4FA6E0;--tide:#3CC6CB;--soft:#14344A;
  --ok:#4CC28C;--okbg:#103626;--bad:#EF7A6E;--badbg:#3A1B19;--warn:#E7AE4E;--warnbg:#382A10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#091823;--paper:#0F2636;--ink:#E4EEF4;--muted:#93ABBB;--line:#22465E;
  --bar:#0B3450;--onbar:#EAF4FA;--water:#4FA6E0;--tide:#3CC6CB;--soft:#14344A;
  --ok:#4CC28C;--okbg:#103626;--bad:#EF7A6E;--badbg:#3A1B19;--warn:#E7AE4E;--warnbg:#382A10;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:1.35rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)}.small{font-size:.85rem}

/* الهيكل */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--onbar);display:flex;align-items:center;gap:12px;padding:10px 18px}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top .brand svg{width:30px;height:30px;flex:none}
.top .brand b{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{margin-inline-start:auto;text-align:left;font-size:.82rem;line-height:1.35}
.top .who span{display:block;opacity:.8}
.top button{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--onbar);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.82rem}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100% - 56px)}
nav.side{background:var(--paper);border-inline-start:1px solid var(--line);padding:16px 10px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px)}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:4px}
nav a svg{width:20px;height:20px;flex:none}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--bar);color:var(--onbar)}
main{padding:22px clamp(14px,3vw,34px) 40px;max-width:1180px;width:100%;min-width:0}
.bottom{display:none}
@media (max-width:820px){
  .layout{display:block}
  nav.side{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;margin:0;font-size:.7rem;text-align:center;border-radius:8px}
  .bottom a.on{background:var(--soft);color:var(--bar)}
  :root[data-theme] .bottom a.on, .bottom a.on{color:var(--water)}
  main{padding-bottom:96px}
  .top .who span{display:none}
}

/* عناصر */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--water)}
.btn.primary{background:var(--bar);border-color:var(--bar);color:var(--onbar)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--water)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item.click{cursor:pointer}.item.click:hover{background:var(--soft)}
.item .id{font-weight:700;font-variant-numeric:tabular-nums}
.item .meta{color:var(--muted);font-size:.84rem}
.item .side{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.82rem}
td.num{font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chartbox{position:relative;height:280px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar-meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:90px}
.bar-meter i{display:block;height:100%;background:var(--tide)}

/* النافذة */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto}
.sheet{background:var(--paper);border-radius:16px;width:min(980px,100%);border:1px solid var(--line)}
.sheet .shead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet .sbody{padding:18px}
.sheet .sfoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;position:sticky;bottom:0;background:var(--paper);border-radius:0 0 16px 16px}
.x{border:0;background:var(--soft);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1.1rem;flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin-bottom:16px}
.facts div{border-bottom:1px dashed var(--line);padding-bottom:6px}
.facts dt{font-size:.78rem;color:var(--muted)}.facts dd{margin:0;font-weight:600}
.locked{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}

/* التقييم وخزان الدرجة */
.evalgrid{display:grid;grid-template-columns:1fr 150px;gap:18px;align-items:start}
@media (max-width:700px){.evalgrid{grid-template-columns:1fr}.gauge{position:static!important;flex-direction:row!important}}
.sec{margin-bottom:16px}
.sec h3{padding:8px 0;border-bottom:2px solid var(--line);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.sec h3 small{color:var(--muted);font-weight:500}
.ck{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.y{background:var(--okbg);color:var(--ok)}
.seg button.n{background:var(--badbg);color:var(--bad)}
.seg button:disabled{cursor:default}
.gauge{position:sticky;top:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tank{position:relative;width:110px;height:190px;border:2px solid var(--water);border-radius:16px 16px 22px 22px;overflow:hidden;background:var(--soft)}
.tank .fill{position:absolute;inset:auto 0 0 0;height:0;background:linear-gradient(180deg,var(--water),var(--bar));transition:height .5s ease}
.tank .fill::before{content:"";position:absolute;top:-6px;left:-10%;width:120%;height:12px;border-radius:50%;background:var(--water);opacity:.6}
.tank .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:var(--ink);text-shadow:0 0 6px var(--paper)}
.tank .read b{font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.gradebox{text-align:center}
.gradebox b{display:block;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.tank .fill{transition:none}}

.toast{position:fixed;z-index:80;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}

/* الدخول */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login .box{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px}
.login .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login .logo svg{width:46px;height:46px}
.demo-users button{display:flex;justify-content:space-between;width:100%;margin-bottom:6px}

#printArea{display:none}
@media print{
  body.printing-doc > *:not(#printArea){display:none!important}
  body.printing-doc #printArea{display:block}
  body.printing-report .top, body.printing-report nav, body.printing-report .bottom, body.printing-report .noprint, body.printing-report .overlay{display:none!important}
  body.printing-report .layout{display:block}
  body{background:#fff;color:#000}
  .panel,.kpi,.list{break-inside:avoid;border-color:#bbb}
  :root{padding:0}
}
.doc{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;color:#000;padding:10mm;font-size:12.5px}
.doc header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0D4C73;padding-bottom:10px;margin-bottom:14px}
.doc header img{height:58px}
.doc h1{font-size:17px;text-align:center;margin:10px 0 14px}
.doc table{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc th,.doc td{border:1px solid #888;padding:6px 8px;white-space:normal;color:#000}
.doc th{background:#E6EEF4;width:28%}
.doc .score{display:flex;gap:10px;margin:12px 0}
.doc .score div{flex:1;border:2px solid #0D4C73;border-radius:8px;text-align:center;padding:8px}
.doc .score b{display:block;font-size:20px}
.doc footer{margin-top:18px;border-top:1px solid #888;padding-top:8px;font-size:11px;color:#333}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   الإعدادات — عدّل هذا الجزء فقط
   ===================================================================== */
const CONFIG = {
  // اتركهما فارغين للتجربة (وضع تجريبي محفوظ في المتصفح)
  // ضع رابط ومفتاح مشروع Violation Management للتشغيل الفعلي
  SUPABASE_URL: 'https://ahsvlqmensttzxbgkcwo.supabase.co',
  SUPABASE_KEY: 'sb_publishable_ETq2Ug9ids2iqpvCsPjsGg_eiRpd_AE',

  PENDING_STATUS: 'بانتظار المراجعة والاعتماد',
  LIST_LIMIT: 60,
  SECTORS: ['القطاع الشرقي','القطاع الأوسط','القطاع الغربي','القطاع الشمالي','القطاع الجنوبي'],

  // سلّم الدرجات: النسبة المئوية ← الدرجة بالرقم (عدّلها حسب الإيميل)
  GRADE_SCALE: [
    { min: 90, grade: 5, label: 'ممتاز' },
    { min: 80, grade: 4, label: 'جيد جداً' },
    { min: 70, grade: 3, label: 'جيد' },
    { min: 60, grade: 2, label: 'مقبول' },
    { min: 0,  grade: 1, label: 'ضعيف' },
  ],

  // قوائم التحقق (weight = وزن البند في الدرجة)
  CHECKLISTS: [
    { title: 'قائمة التحقق الأولى: بيانات المخالفة', items: [
      { id: 'a1', text: 'رقم الحساب / العداد مطابق للموقع', weight: 1 },
      { id: 'a2', text: 'الموقع والإحداثيات صحيحة', weight: 1 },
      { id: 'a3', text: 'تاريخ ووقت الضبط مسجلان', weight: 1 },
      { id: 'a4', text: 'بند المخالفة مطابق لدليل دراسة المخالفات وآلية ضبطها', weight: 1 },
    ]},
    { title: 'قائمة التحقق الثانية: الإثباتات', items: [
      { id: 'b1', text: 'صور واضحة للمخالفة قبل الإزالة', weight: 1 },
      { id: 'b2', text: 'صور بعد الإزالة أو الإصلاح', weight: 1 },
      { id: 'b3', text: 'محضر الضبط مكتمل البيانات', weight: 1 },
      { id: 'b4', text: 'بيانات المخالف مكتملة', weight: 1 },
    ]},
    { title: 'قائمة التحقق الثالثة: الإجراءات والاحتساب', items: [
      { id: 'c1', text: 'حساب المنفعة المفقودة مرفق وصحيح', weight: 1 },
      { id: 'c3', text: 'تكاليف الإصلاح محسوبة وفق الدليل', weight: 1 },
      { id: 'c4', text: 'إشعار المخالف بالمخالفة', weight: 1 },
    ]},
  ],
};
/* ===================================================================== */

const ROLES = { admin:'مدير النظام', executive:'المدير التنفيذي', quality_manager:'مدير الجودة', quality_specialist:'أخصائي جودة', sector_auditor:'مدقق القطاع', pending:'بانتظار التفعيل' };
const PAGES = [
  { id:'home', label:'الرئيسية', short:'الرئيسية', icon:'home', roles:'*' },
  { id:'audit', label:'المخالفات والتدقيق', short:'التدقيق', icon:'audit', roles:['admin','sector_auditor'] },
  { id:'audit-reports', label:'تقارير التدقيق', short:'تقارير التدقيق', icon:'chart', roles:['admin','sector_auditor','executive','quality_manager'] },
  { id:'quality', label:'جودة المخالفات', short:'الجودة', icon:'drop', roles:['admin','quality_manager','quality_specialist'] },
  { id:'quality-reports', label:'تقارير الجودة', short:'تقارير الجودة', icon:'pie', roles:['admin','quality_manager','executive','quality_specialist'] },
];
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  audit:'<path d="M9 4h6v3H9zM7 5H5v16h14V5h-2"/><path d="M8.5 13.5l2.5 2.5 4.5-5"/>',
  chart:'<path d="M5 20V11M11 20V5M17 20v-7M3 20h18"/>',
  drop:'<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/><path d="M9 15l2 2 4-4"/>',
  pie:'<path d="M11 4a8 8 0 1 0 9 9h-9z"/><path d="M14 3.5A7 7 0 0 1 20.5 10H14z"/>',
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const LOGO = `<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#fff"/><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DA9E8"/><stop offset="1" stop-color="#0D4C73"/></linearGradient></defs><path d="M24 7s12 13 12 21a12 12 0 0 1-24 0c0-8 12-21 12-21z" fill="url(#lg)"/><path d="M18.5 28.5l4 4 7.5-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/\s+/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const fmtDate = d => d ? new Date(d).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const isPending = v => !v.status || norm(v.status) === norm(CONFIG.PENDING_STATUS);
const isMgr = () => ['admin','quality_manager'].includes(ME?.role);
const canSeeAllQuality = () => ['admin','quality_manager','executive'].includes(ME?.role);
const ALL_ITEMS = CONFIG.CHECKLISTS.flatMap(s => s.items);
let ME = null;

function toast(msg, bad){
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3800);
}
function gradeFor(pct){ return CONFIG.GRADE_SCALE.find(g => pct >= g.min) || CONFIG.GRADE_SCALE[CONFIG.GRADE_SCALE.length-1]; }
function computeScore(state){
  const total = ALL_ITEMS.reduce((a,i) => a + i.weight, 0);
  const got = ALL_ITEMS.reduce((a,i) => a + (state[i.id] === 'مكتمل' ? i.weight : 0), 0);
  const percent = total ? Math.round(got / total * 100) : 0;
  const g = gradeFor(percent);
  return { percent, grade: g.grade, label: g.label, answered: ALL_ITEMS.filter(i => state[i.id]).length };
}

/* =============================== طبقة البيانات =============================== */
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;
const DEMO_KEY = 'qa_demo_v2';
function seed(){
  const P = (id,full_name,role,sector) => ({ id, full_name, role, sector: sector || null, email: id + '@nwc.com.sa', active: true });
  const profiles = [
    P('u0','ناجي عبدالله المطيري','admin'),
    P('u1','عايض القحطاني','quality_manager'),
    P('u2','تركي الدوسري','quality_manager'),

async function fetchAll(build){

  for (;;) { const { data, error } = await build().range(from, from + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; from += 1000; }
  return out;
}

const COLS = {
  id:['رقم المخالفة','رقم المخالفه','رقم الزيارة','رقم الطلب'],

};
function pick(row, keys){
  const hs = Object.keys(row);
  for (const k of keys) { const h = hs.find(h => norm(h) === norm(k)); if (h) return String(row[h]).trim(); }
  for (const k of keys) { const h = hs.find(h => norm(h).includes(norm(k))); if (h) return String(row[h]).trim(); }
  return '';
}
async function importFile(file, sector){
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:false });
    const map = new Map(); let other = 0;
    for (const r of rows) {
      const id = pick(r, COLS.id); if (!id) continue;
      const status = pick(r, COLS.status);
      if (status && norm(status) !== norm(CONFIG.PENDING_STATUS)) { other++; continue; }
      const raw = {}; Object.keys(r).forEach(k => { if (String(r[k]).trim()) raw[k.trim()] = String(r[k]).trim(); });
      map.set(id, { id, region: sector, governorate: pick(r, COLS.governorate), status: status || CONFIG.PENDING_STATUS, clause: pick(r, COLS.clause),
        inspector: pick(r, COLS.inspector), inspector_email: pick(r, COLS.inspector_email), v_date: pick(r, COLS.v_date), raw, imported_at: new Date().toISOString() });
    }
    if (!map.size) return toast('لم يُعثر على مخالفات بانتظار المراجعة والاعتماد في الملف', true);
    await Store.importViolations([...map.values()]);
    toast(`تم تحميل ${map.size} مخالفة بانتظار المراجعة والاعتماد (استُبعد ${other} بحالات أخرى)`);
  } catch(e) { console.error(e); toast('تعذّر قراءة الملف: ' + e.message, true); }
}

    </div></div>`).join('')}</div>`).join('');
}
function bindChecklist(root, state, onChange){
  root.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    state[seg.dataset.item] = b.dataset.v;
    seg.querySelectorAll('button').forEach(x => x.className = x === b ? (b.dataset.v === 'مكتمل' ? 'y' : 'n') : '');
    onChange && onChange();
  }));
}
const statusTag = s => !s ? '' : `<span class="tag ${s === 'مكتمل' ? 'ok' : s === 'معاد للمفتش' ? 'warn' : 'bad'}">${esc(s)}</span>`;

  let tab = 'todo', q = '';
  el.innerHTML = `<div class="head"><div><h1>المخالفات والتدقيق</h1><div class="muted">تدقيق ملفات المخالفات في القطاعات قبل وصولها لجودة المركز الرئيسي</div></div>
    ${ME.role === 'admin' ? `<select id="asec" style="max-width:220px">${CONFIG.SECTORS.map(s => `<option ${s === sector ? 'selected' : ''}>${s}</option>`).join('')}</select>` : ''}</div>

    const rows = base.filter(v => tab === 'todo' ? !v.audit_status : v.audit_status).filter(v => matches(v, q));
    $('#alist').innerHTML = listBlock({ rows, q, emptyMsg: tab === 'todo' ? 'لا توجد مخالفات بانتظار التدقيق. حمّل الملف الشامل من الصفحة الرئيسية.' : 'لم تُدقق أي مخالفة بعد.',
      render: v => `<div class="item click" data-id="${esc(v.id)}"><div><div class="id">${esc(v.id)}</div><div class="meta">${esc(v.governorate)} · ${esc(v.clause)} · ${esc(v.inspector)}</div></div><div class="side">${statusTag(v.audit_status)}</div></div>` });
    $('#alist').querySelectorAll('[data-id]').forEach(r => r.onclick = () => openAudit(vs.find(v => v.id === r.dataset.id), amap[r.dataset.id], () => route()));

function openAudit(v, existing, done){
  const state = { ...(existing?.checklist || {}) };
  const m = modal(`<div class="shead"><div><h2>تدقيق المخالفة ${esc(v.id)}</h2><div class="muted small">${existing ? 'آخر تدقيق: ' + fmtDate(existing.updated_at || existing.created_at) + ' — ' + esc(existing.auditor_name) : 'تدقيق جديد'}</div></div><button class="x" data-close aria-label="إغلاق">×</button></div>
    <div class="sbody">${factsHtml(v)}${checklistHtml(state, true)}
      <div class="field"><label for="anote">ملاحظات المدقق</label><textarea id="anote">${esc(existing?.note || '')}</textarea></div></div>
    <div class="sfoot"><button class="btn primary" id="aSave">حفظ التدقيق</button><button class="btn" data-close>إلغاء</button></div>`);

    if (ALL_ITEMS.some(i => !state[i.id])) return toast('أكمل جميع بنود قوائم التحقق', true);
    const result = ALL_ITEMS.every(i => state[i.id] === 'مكتمل') ? 'مكتمل' : 'غير مكتمل';
    try {
      await Store.saveAudit({ violation_id: v.id, region: v.region, auditor: ME.id, auditor_name: ME.full_name, checklist: state, result, note: m.querySelector('#anote').value.trim(),
        created_at: existing?.created_at || new Date().toISOString(), updated_at: new Date().toISOString() });

          <button class="btn" data-open="${esc(v.id)}">تقييم</button></div></div>` });
    } else {

        render: e => `<div class="item click" data-ev="${esc(e.violation_id)}"><div><div class="id">${esc(e.violation_id)}</div><div class="meta">${esc(e.region)} · ${esc(e.inspector)} · ${esc(e.evaluator_name)} · ${fmtDate(e.created_at)}</div></div>
          <div class="side"><span class="tag">${e.percent}% — ${e.grade} ${esc(e.grade_label)}</span>${statusTag(e.status)}</div></div>` });
    }
    $('#qlist').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openEval(vmap[b.dataset.open], null));
    $('#qlist').querySelectorAll('[data-ev]').forEach(r => r.onclick = () => { const e = evs.find(x => x.violation_id === r.dataset.ev); openEval(vmap[e.violation_id] || { id: e.violation_id, region: e.region, inspector: e.inspector }, e); });
    $('#qlist').querySelectorAll('[data-assign]').forEach(s => s.onchange = async () => {
      try { await Store.assign(s.dataset.assign, s.value); vmap[s.dataset.assign].assigned_to = s.value || null; toast(s.value ? 'تم الإسناد إلى ' + pname(s.value) : 'أُلغي الإسناد'); } catch(e) { toast(e.message, true); }

function openEval(v, existing){
  const editable = !existing || isMgr();
  const state = { ...(existing?.checklist || {}) };
  const sub = existing ? `قيّمها ${esc(existing.evaluator_name)} في ${fmtDate(existing.created_at)}${existing.updated_at ? ' · آخر تعديل ' + fmtDate(existing.updated_at) : ''}` : 'تقييم جديد';

      ${factsHtml(v)}${checklistHtml(state, editable)}

        <textarea id="enote" ${existing ? 'readonly' : ''} required>${esc(existing?.note || '')}</textarea></div>
      ${existing && isMgr() ? `<div class="field"><label for="mnote">سبب تعديل مدير الجودة (إلزامي عند التعديل)</label><textarea id="mnote"></textarea></div>` : ''}

    </div>
    <aside class="gauge" aria-live="polite"><div class="tank"><div class="fill" id="tfill"></div><div class="read"><b id="tpct">0%</b><span class="small">النسبة</span></div></div>
      <div class="gradebox"><span class="muted small">الدرجة</span><b id="tgrade">—</b><span class="muted small" id="tans"></span></div></aside>
    </div></div>
    <div class="sfoot">
      ${!existing ? `<button class="btn ok" id="eDone">تم — حفظ وطباعة المستند الداعم</button><button class="btn warn" id="eReturn">إعادة للمفتش</button><button class="btn" data-close>إلغاء</button>` : ''}
      ${existing && isMgr() ? `<button class="btn primary" id="eEdit">حفظ التعديل</button>` : ''}
      ${existing ? `<button class="btn" id="ePrint">طباعة المستند الداعم</button>${existing.status === 'معاد للمفتش' && v.inspector_email ? '<button class="btn warn" id="eMail">إعادة إرسال الإيميل للمفتش</button>' : ''}<button class="btn" data-close>إغلاق</button>` : ''}
    </div>`);
  const upd = () => { const s = computeScore(state); m.querySelector('#tfill').style.height = s.percent + '%'; m.querySelector('#tpct').textContent = s.percent + '%';
    m.querySelector('#tgrade').textContent = s.answered ? `${s.grade} — ${s.label}` : '—'; m.querySelector('#tans').textContent = `${s.answered} من ${ALL_ITEMS.length} بنداً`; };
  bindChecklist(m, state, upd); upd();

  const build = status => {
    const s = computeScore(state);
    return { violation_id: v.id, region: v.region, governorate: v.governorate || '', inspector: v.inspector || '', evaluator: ME.id, evaluator_name: ME.full_name,
      checklist: { ...state }, percent: s.percent, grade: s.grade, grade_label: s.label, note: m.querySelector('#enote').value.trim(), status, history: [], created_at: new Date().toISOString() };
  };
  const valid = () => {
    if (ALL_ITEMS.some(i => !state[i.id])) { toast('أكمل جميع بنود قوائم التحقق', true); return false; }
    if (!m.querySelector('#enote').value.trim()) { toast('ملاحظة المقيّم إلزامية', true); m.querySelector('#enote').focus(); return false; }
    return true;
  };
  if (!existing) {
    m.querySelector('#eDone').onclick = async () => {
      if (!valid()) return; if (!confirm('سيُحفظ التقييم ولا يمكن تعديله إلا من مدير الجودة. متابعة؟')) return;
      const e = build('مكتمل');
      try { await Store.saveEvaluation(e); m.close(); toast('تم حفظ التقييم'); printDoc(v, e); route(); } catch(err) { toast(err.message, true); }
    };
    m.querySelector('#eReturn').onclick = async () => {
      if (!valid()) return;
      let email = v.inspector_email;
      if (!email) { email = prompt('اكتب بريد مأمور الضبط لإشعاره بالإعادة:'); if (!email) return; }
      const e = build('معاد للمفتش');
      try { await Store.saveEvaluation(e); m.close(); toast('أُعيدت المخالفة للمفتش'); mailInspector({ ...v, inspector_email: email }, e); route(); } catch(err) { toast(err.message, true); }
    };
  } else {
    m.querySelector('#ePrint').onclick = () => printDoc(v, existing);
    if (m.querySelector('#eMail')) m.querySelector('#eMail').onclick = () => mailInspector(v, existing);
    if (m.querySelector('#eEdit')) m.querySelector('#eEdit').onclick = async () => {
      if (ALL_ITEMS.some(i => !state[i.id])) return toast('أكمل جميع بنود قوائم التحقق', true);
      const why = m.querySelector('#mnote').value.trim(); if (!why) return toast('اكتب سبب التعديل', true);
      const s = computeScore(state);
      const patch = { checklist: { ...state }, percent: s.percent, grade: s.grade, grade_label: s.label, updated_at: new Date().toISOString(), updated_by: ME.id,
        history: [ ...(existing.history || []), { by: ME.full_name, at: new Date().toISOString(), note: why, from: existing.percent, to: s.percent } ] };
      try { await Store.updateEvaluation(existing.violation_id, patch); m.close(); toast('تم حفظ التعديل'); route(); } catch(err) { toast(err.message, true); }
    };
  }
}

function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function chart(canvas, cfg){
  if (window.ChartDataLabels && !chart.reg) { Chart.register(ChartDataLabels); chart.reg = true; }
  Chart.defaults.font.family = '"IBM Plex Sans Arabic", Tahoma, sans-serif'; Chart.defaults.color = css('--muted');
  const c = new Chart(canvas, cfg); CHARTS.push(c); return c;
}
function barCfg(labels, datasets, opts = {}){
  const palette = [css('--water'), css('--tide'), css('--warn'), css('--bad')];
  return { type: 'bar', data: { labels, datasets: datasets.map((d, i) => ({ borderRadius: 6, backgroundColor: d.color || palette[i % 4], ...d })) },
    options: { maintainAspectRatio: false, indexAxis: opts.horizontal ? 'y' : 'x', layout: { padding: { top: 22, left: 10 } },
      scales: { x: { grid: { display: false }, stacked: opts.stacked, max: opts.max, ticks: { color: css('--ink') } }, y: { grid: { color: css('--line') }, stacked: opts.stacked, beginAtZero: true, max: opts.horizontal ? undefined : opts.max, ticks: { color: css('--ink') } } },
      plugins: { legend: { display: datasets.length > 1, labels: { color: css('--ink') } },
        datalabels: { anchor: opts.stacked ? 'center' : 'end', align: opts.stacked ? 'center' : 'end', color: opts.stacked ? '#fff' : css('--ink'), font: { weight: 700 }, formatter: v => v ? v + (opts.suffix || '') : '' } } } };
}

    { label: 'مكتملة', data: Object.values(m).map(x => x.ok), color: css('--ok') },
    { label: 'غير مكتملة', data: Object.values(m).map(x => x.no), color: css('--bad') },
    { label: 'بانتظار التدقيق', data: Object.values(m).map(x => x.total - x.done), color: css('--line') } ], { stacked: true }));
  mk('#c1', reg); mk('#c2', gov);
  CHARTS.forEach(c => { c.options.plugins.datalabels.color = ctx => ctx.datasetIndex === 2 ? css('--ink') : '#fff'; c.update(); });
}

/* =============================== تقارير الجودة =============================== */
async function pageQualityReports(el){
  const [vs, evs] = await Promise.all([Store.violations(), Store.evaluations()]);
  const scopeSelf = !canSeeAllQuality();
  const mine = scopeSelf ? evs.filter(e => e.evaluator === ME.id) : evs;
  const avg = a => a.length ? Math.round(a.reduce((s, e) => s + e.percent, 0) / a.length) : 0;
  const people = {}; mine.forEach(e => { (people[e.evaluator_name] = people[e.evaluator_name] || []).push(e); });
  const sectors = {}; vs.filter(isPending).forEach(v => { const s = v.region || '—'; sectors[s] = sectors[s] || { total:0, done:0 }; sectors[s].total++; if (v.qa_status) sectors[s].done++; });
  const assigned = id => vs.filter(v => v.assigned_to === id).length;
  const statuses = {}; mine.forEach(e => statuses[e.status] = (statuses[e.status] || 0) + 1);
  const grades = CONFIG.GRADE_SCALE.map(g => ({ g, n: mine.filter(e => e.grade === g.grade).length }));
  const allPend = vs.filter(isPending).length, allDone = vs.filter(v => isPending(v) && v.qa_status).length;
  el.innerHTML = `<div class="head"><div><h1>${scopeSelf ? 'أدائي في الجودة' : 'تقارير الجودة'}</h1><div class="muted">${scopeSelf ? 'تقييماتك فقط' : 'أداء أخصائيي الجودة بالمركز الرئيسي'}</div></div>
      <div class="row noprint"><button class="btn primary" id="xl">تصدير Excel</button><button class="btn" id="pr">طباعة / PDF</button></div></div>
    <div class="kpis"><div class="kpi"><b>${mine.length}</b><span>مخالفة مقيّمة</span></div><div class="kpi"><b>${avg(mine)}%</b><span>متوسط التقييم</span></div>
      <div class="kpi"><b>${mine.filter(e => e.status === 'معاد للمفتش').length}</b><span>معادة للمفتش</span></div>
      <div class="kpi"><b>${scopeSelf ? (assigned(ME.id) ? Math.round(mine.filter(e => vs.find(v => v.id === e.violation_id && v.assigned_to === ME.id)).length / assigned(ME.id) * 100) + '%' : '—') : (allPend ? Math.round(allDone / allPend * 100) + '%' : '—')}</b><span>${scopeSelf ? 'إنجاز المسند لك' : 'نسبة الإنجاز الكلية'}</span></div></div>
    ${mine.length ? `<div class="charts">
      ${scopeSelf ? '' : `<section class="panel"><h2>عدد التقييمات لكل أخصائي</h2><div class="chartbox"><canvas id="q1"></canvas></div></section>
      <section class="panel"><h2>متوسط التقييم لكل أخصائي</h2><div class="chartbox"><canvas id="q2"></canvas></div></section>`}
      <section class="panel"><h2>توزيع الدرجات</h2><div class="chartbox"><canvas id="q3"></canvas></div></section>
      <section class="panel"><h2>حالات التقييم</h2><div class="chartbox"><canvas id="q4"></canvas></div></section></div>` : '<div class="panel empty">لا توجد تقييمات بعد.</div>'}
    <section class="panel"><h2>نسبة الإنجاز حسب القطاع</h2><div class="tablewrap"><table><thead><tr><th>القطاع</th><th>بانتظار المراجعة والاعتماد</th><th>تم تقييمها</th><th>الإنجاز</th></tr></thead><tbody>
      ${Object.entries(sectors).map(([k, x]) => { const p = Math.round(x.done / x.total * 100); return `<tr><td>${esc(k)}</td><td class="num">${x.total}</td><td class="num">${x.done}</td><td><div class="row"><div class="bar-meter"><i style="width:${p}%"></i></div><span class="num">${p}%${p === 100 ? ' مكتمل' : ''}</span></div></td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">لا توجد بيانات</td></tr>'}
    </tbody></table></div></section>
    ${scopeSelf ? '' : `<section class="panel"><h2>أداء أخصائيي الجودة</h2><div class="tablewrap"><table><thead><tr><th>الأخصائي</th><th>عدد المقيّمة</th><th>متوسط التقييم</th><th>معادة للمفتش</th><th>آخر تقييم</th></tr></thead><tbody>
      ${Object.entries(people).map(([n, a]) => `<tr><td>${esc(n)}</td><td class="num">${a.length}</td><td class="num">${avg(a)}%</td><td class="num">${a.filter(e => e.status === 'معاد للمفتش').length}</td><td>${fmtDate(a.map(e => e.created_at).sort().pop())}</td></tr>`).join('')}
    </tbody></table></div></section>`}`;
  $('#pr').onclick = reportPrintBtn;
  $('#xl').onclick = () => exportQuality(mine, people, sectors, avg, vs);
  if (!mine.length) return;
  if (!scopeSelf) {
    chart($('#q1'), barCfg(Object.keys(people), [{ label: 'عدد التقييمات', data: Object.values(people).map(a => a.length) }]));
    chart($('#q2'), barCfg(Object.keys(people), [{ label: 'متوسط التقييم', data: Object.values(people).map(avg), color: css('--tide') }], { max: 100, suffix: '%' }));
  }
  chart($('#q3'), barCfg(grades.map(x => `${x.g.grade} ${x.g.label}`), [{ label: 'عدد المخالفات', data: grades.map(x => x.n), color: css('--water') }]));
  chart($('#q4'), { type: 'doughnut', data: { labels: Object.keys(statuses), datasets: [{ data: Object.values(statuses), backgroundColor: Object.keys(statuses).map(s => s === 'مكتمل' ? css('--ok') : css('--warn')), borderColor: css('--paper') }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: css('--ink') } }, datalabels: { color: '#fff', font: { weight: 700, size: 14 } } } } });
}
function exportQuality(mine, people, sectors, avg, vs){
  const detail = mine.map(e => ({ 'أخصائي الجودة': e.evaluator_name, 'رقم المخالفة': e.violation_id, 'القطاع': e.region, 'المحافظة': e.governorate, 'مأمور الضبط': e.inspector,
    'النسبة %': e.percent, 'الدرجة': e.grade, 'التقدير': e.grade_label, 'تاريخ التقييم': fmtDate(e.created_at), 'حالة التقييم': e.status, 'ملاحظة المقيّم': e.note }));
  const summary = Object.entries(people).map(([n, a]) => {
    const pid = a[0].evaluator; const asg = vs.filter(v => v.assigned_to === pid).length;
    return { 'أخصائي الجودة': n, 'عدد المخالفات المقيّمة': a.length, 'متوسط التقييم %': avg(a), 'مكتمل': a.filter(e => e.status === 'مكتمل').length, 'معاد للمفتش': a.filter(e => e.status === 'معاد للمفتش').length,
      'المسندة له': asg || '—', 'نسبة إنجاز المسند': asg ? Math.round(a.filter(e => vs.find(v => v.id === e.violation_id)?.assigned_to === pid).length / asg * 100) + '%' : '—' };
  });
  const sec = Object.entries(sectors).map(([k, x]) => ({ 'القطاع': k, 'بانتظار المراجعة والاعتماد': x.total, 'تم تقييمها': x.done, 'نسبة الإنجاز': Math.round(x.done / x.total * 100) + '%' }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  const add = (rows, name) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'لا توجد بيانات': '' }]); ws['!cols'] = Object.keys(rows[0] || { a:1 }).map(() => ({ wch: 20 })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(summary, 'ملخص الأداء'); add(detail, 'تفاصيل التقييمات'); add(sec, 'الإنجاز حسب القطاع');
  XLSX.writeFile(wb, `تقرير-الجودة-${new Date().toISOString().slice(0,10)}.xlsx`);
}

boot();
</script>
