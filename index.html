<style>
:root{
  --bg:#F3F6F9; --paper:#FFFFFF; --ink:#13283D; --muted:#5A6B7C; --line:#D6DFE7;
  --navy:#0E3557; --navy-ink:#FFFFFF; --ok:#1C7A4B; --ok-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FCE9E7;
  --warn:#9A5B07; --warn-bg:#FDF1DC; --field:#F8FAFC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1722; --paper:#14212E; --ink:#E4ECF3; --muted:#93A5B6; --line:#26384A;
    --navy:#2D6A9F; --ok:#4CC38A; --ok-bg:#12301F; --bad:#F2796C; --bad-bg:#3A1714; --warn:#E8B04B; --warn-bg:#33270F; --field:#101B26;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1722; --paper:#14212E; --ink:#E4ECF3; --muted:#93A5B6; --line:#26384A;
  --navy:#2D6A9F; --ok:#4CC38A; --ok-bg:#12301F; --bad:#F2796C; --bad-bg:#3A1714; --warn:#E8B04B; --warn-bg:#33270F; --field:#101B26;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 140px}
header.top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:6px 2px 16px}
header.top h1{font-size:21px;line-height:1.35;margin:0;font-weight:700}
header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.upload{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--navy);color:var(--navy-ink);border:0;border-radius:14px;padding:10px 12px;cursor:pointer;font-size:12px;font-weight:600}
.upload svg{width:24px;height:24px}
.upload:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #5AA0DA;outline-offset:2px}
section.block{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
section.block > h2{font-size:16px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--muted);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f .req{color:var(--bad)}
input.in,select.in,textarea.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);min-height:42px}
textarea.in{min-height:84px;resize:vertical;line-height:1.7}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
/* queue */
.queue-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.queue-tools input{flex:1 1 180px}
.queue{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--paper);width:100%;text-align:right;border-left:0;border-right:0;border-top:0}
.qrow:last-child{border-bottom:0}
.qrow[aria-current="true"]{background:var(--field);box-shadow:inset -4px 0 0 var(--navy)}
.qrow .id{font-weight:700;font-size:14px;direction:ltr;text-align:right}
.qrow .t{grid-column:1/2;font-size:13px}
.qrow .m{grid-column:1/-1;font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;align-self:start}
.b-new{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-ret{background:var(--bad-bg);color:var(--bad)}
.b-prog{background:var(--warn-bg);color:var(--warn)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
/* inspector explanation */
.explain{border-radius:12px;padding:12px;background:var(--field);border:1px solid var(--line)}
.explain.short{border-color:var(--warn);background:var(--warn-bg)}
.explain .hint{font-size:12px;color:var(--warn);margin-top:6px;font-weight:600}
/* checklist */
.by{font-size:13px;color:var(--muted);margin:2px 0 12px}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;background:var(--warn-bg);color:var(--warn)}
h3.sec{font-size:14px;margin:18px 0 8px;font-weight:700;display:flex;justify-content:space-between}
h3.sec span{font-weight:500;color:var(--muted);font-size:12px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);transition:border-color .15s}
li.item.s-ok{border-color:var(--ok);box-shadow:inset -4px 0 0 var(--ok)}
li.item.s-bad{border-color:var(--bad);box-shadow:inset -4px 0 0 var(--bad)}
.item .txt{font-size:14px;margin-bottom:8px}
.item .txt b{color:var(--muted);font-weight:600;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:6px 14px;cursor:pointer;font-size:13px;min-width:92px}
.seg button + button{border-right:1px solid var(--line)}
.seg button.on-ok{background:var(--ok);color:#fff}
.seg button.on-bad{background:var(--bad);color:#fff}
.item textarea{margin-top:8px;min-height:56px;font-size:13px}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.meter{flex:1;min-width:0}
.meter .lbl{font-size:13px;display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.meter .lbl b{font-size:15px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .g{background:var(--ok)} .track .r{background:var(--bad)}
.act{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:14px}
.act.print{background:var(--ok);color:#fff}
.act.ret{background:var(--bad);color:#fff}
.act.wait{background:var(--line);color:var(--muted);cursor:not-allowed}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.5);display:none;z-index:9;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet pre{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:13px;line-height:1.8;margin:10px 0}
.sheet .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn2{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn2.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.att{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);min-height:40px}
.attbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.attbtn:focus-within{outline:3px solid #5AA0DA;outline-offset:2px}
.th{position:relative;width:56px;height:56px;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;cursor:pointer;background:#fff}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;bottom:0;left:0;right:0;background:rgba(14,53,87,.88);color:#fff;font-size:10px;text-align:center;line-height:1.6}
.viewer img{width:100%;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;display:block}
li.item.act{outline:2px solid #5AA0DA;outline-offset:2px}
button.attbtn{background:none;font:inherit}
.pastehint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
#printDoc{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .wrap,.bar,.sheet-bg,.toast{display:none!important}
  #printDoc{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>نظام الجودة والتحقق من متطلبات والاشتراطات اللازمة للمخالفات</h1>
      <p>وفق دليل دراسة المخالفات وآلية ضبطها (بعد التحديث)</p>
    </div>
    <button class="upload" id="upBtn" type="button" aria-label="رفع ملف المخالفات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="M9.5 13.5 12 11l2.5 2.5"/></svg>
      ملف المخالفات
    </button>
    <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
  </header>

  <section class="block" id="queueBlock">
    <h2>المخالفات بانتظار التدقيق <span class="sub" id="qCount"></span></h2>
    <div id="queueBody"></div>
  </section>

  <section class="block">
    <h2>نموذج تدقيق المخالفات</h2>
    <div class="grid">
      <label class="f full">المخالفة <span class="req">*</span>
        <select class="in" id="typeSel"></select>
      </label>
      <label class="f">رقم الزيارة <span class="req">*</span><input class="in" data-f="vno" dir="ltr" placeholder="SWA-000000"></label>
      <label class="f">المخالف <span class="req">*</span><input class="in" data-f="name" placeholder="اسم المخالف"></label>
      <label class="f">رقم هوية المخالف<input class="in" data-f="nid" inputmode="numeric" dir="ltr"></label>
      <label class="f">رقم جوال المخالف<input class="in" data-f="phone" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx"></label>
      <label class="f">رقم العداد<input class="in" data-f="meter" dir="ltr"></label>
      <label class="f">تاريخ الضبط<input class="in" data-f="date" placeholder="يوم/شهر/سنة"></label>
      <label class="f full">الموقع<input class="in" data-f="loc" placeholder="المحافظة، الحي، الإحداثيات"></label>
      <label class="f">اسم مأمور الضبط<input class="in" data-f="officer"></label>
      <label class="f">اسم المدقق <span class="req">*</span><input class="in" id="auditor"></label>
    </div>
  </section>

  <section class="block">
    <h2>شرح المخالفة من مأمور الضبط</h2>
    <div class="explain" id="explainBox">
      <textarea class="in" data-f="explain" placeholder="الشرح المفصل كما كتبه مأمور الضبط، شاملاً الآثار والأضرار المترتبة على المخالفة"></textarea>
      <div class="hint" id="explainHint" hidden></div>
    </div>
  </section>

  <section class="block" id="checkBlock">
    <h2>قائمة التحقق</h2>
    <div id="checkBody"></div>
  </section>

  <section class="block">
    <h2>ملاحظات عامة على المعاملة</h2>
    <textarea class="in" data-f="gnotes" placeholder="ملاحظات لا تخص فقرة بعينها"></textarea>
  </section>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="meter">
      <div class="lbl"><span id="barState">اختر المخالفة لبدء التدقيق</span><b id="barNum"></b></div>
      <div class="track"><i class="g" id="trG" style="width:0"></i><i class="r" id="trR" style="width:0"></i></div>
    </div>
    <button type="button" class="act wait" id="actBtn" disabled>أكمل التدقيق</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="printDoc"></div>

<script>
/* ===================== دليل المتطلبات ===================== */
const P1="التأكد من توافق الموقع في صور المخالفة";
const P2="عدم اختلاف تاريخ الضبط في صور ضبط المخالفة";
const PROP="صورة توضح العقار المخالف من كافة الجوانب لتوضيح حجم العقار";
const LINK="إرفاق مستند من النظام يوضح ارتباط العقار بالمخالف";
const DIA="توضيح حجم قطر العداد";
const HIDE="صور توضح ما يثبت الإخفاء (أثر الإخفاء، التغطية.. إلخ)";
const BRK=["صورة واضحة للكسر من عدة اتجاهات","تقديم مخطط الإذن بالحفر","إضافة مساحة المقطع المثقوب"];
const BRKP="صورة واضحة للكسر لإثبات ضبط المخالفة";
const DMG3=["صور واضحة لموضع الكسر أو الإتلاف","تفعيل وصف المخالفة في تحديد نوع الضرر (جزئي / كلي)","توضيح أثر الضرر (تسرب / تعطيل)"];
const TAMPER=[PROP,LINK,"صورة توضح موضع العداد قبل فك العداد للفحص","صورة واضحة لنوع التلاعب أو العبث بتاريخ بعد الفحص","إرفاق تقرير فحص العداد يثبت التلاعب","توحيد مستند فحص العداد","إرفاق مستند الفحص بصيغة PDF وعدم تصويره من الورق",DIA];
const TAMPERP=[P1,P2,"مطابقة بيانات المخالف مع البيانات في فحص العداد"];
const SAMPLE=["صورة واضحة للمادة الملقاة","صورة واضحة للخطوط المعتدى عليها","مستند عينة فحص للخطوط المعتدى عليها"];
const SAMPLEP=[P1,P2,"صورة واضحة للإلقاء لإثبات ضبط المخالفة","مطابقة فحص العينة باسم المخالف والتأكد أن المستند موثق من شركة المياه الوطنية"];
const SEWER=["صورة واضحة للخطوط التي تم التعدي عليها","تصوير الأدوات المستخدمة في الاعتداء"];
const NWC="شركة المياه الوطنية", BOTH="شركة المياه الوطنية / الهيئة السعودية للمياه";
const GENERAL=[
  "شرح المخالفة بشكل مفصل من مأمور الضبط، شاملاً الآثار والأضرار المترتبة عليها",
  "إرفاق المستند الداعم بصيغة PDF متضمناً جميع مرفقات المخالفة"
];
const V=(cat,name,req,proc,by=NWC)=>({cat,name,req,proc,by});
const C1="مخالفات العبث بالعداد",C2="مخالفات تدفق المياه",C3="مخالفات الاعتداء على الخطوط الفرعية والرئيسية",C4="مخالفات البنية الأساسية",C5="مخالفات مياه الشرب",C6="مخالفات المرخص لهم",C7="مخالفات التوصيل بطريقة غير نظامية",C8="مخالفات التوصيل بالصرف الصحي بطريقة غير نظامية",C9="مخالفات إلحاق الضرر بشبكات الصرف الصحي";
const GUIDE=[
 V(C1,"إخفاء العداد",[PROP,"إرفاق مستند من النظام يوضح العداد وموقع العداد وبيانات المخالف","صورة توضح موضع العداد وإخفاءه",DIA],[P1,P2,"صور واضحة لنوع الإخفاء لإثبات ضبط المخالفة","مطابقة بيانات المخالف مع البيانات في المستند"]),

/* ===================== مطابقة نص البند ===================== */
function norm(s){return String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\u0600-\u06FF0-9 ]/g," ").replace(/\s+/g," ").trim()}
function matchType(txt){
  const a=new Set(norm(txt).split(" ").filter(w=>w.length>1));if(!a.size)return -1;
  let best=-1,score=0;
  GUIDE.forEach((g,i)=>{const b=new Set(norm(g.name).split(" ").filter(w=>w.length>1));let inter=0;a.forEach(w=>{if(b.has(w))inter++});const s=inter/Math.max(a.size,Math.min(b.size,a.size+3));if(s>score){score=s;best=i}});
  return score>=0.6?best:-1;
}

/* ===================== قراءة ملف الإكسل ===================== */
const COLS={vno:"معرف المخالفة",visit:"رقم الزيارة",name:"اسم المخالف",nid:"هوية المخالف",coords:"موقع المخالفة",coords2:"الاحداثيات",gov:"المحافظة",date:"تاريخ بدء الزيارة",date2:"تاريخ انشاء الزيارة",officer:"اسم المفتش",explain:"ملاحظات المفتش",item:"وصف بند اللائحة",prop:"نوع العقار",sev:"نوع المخالفة",status:"حالة المخالفة"};
function fmtDate(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getDate()}/${v.getMonth()+1}/${v.getFullYear()}`;
  const s=String(v||"").trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${+m[2]}/${+m[1]}/${y}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${+m[3]}/${+m[2]}/${m[1]}`;
  return s.split(" ")[0];
}
$("#upBtn").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==="undefined"){toast("تعذر تحميل قارئ ملفات الإكسل، أعد فتح الصفحة");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    const g=(r,k)=>String(r[COLS[k]]??"").trim();
    const out=data.map(r=>{
      const coords=g(r,"coords")||g(r,"coords2");
      return {vno:g(r,"vno"),visit:g(r,"visit"),name:g(r,"name"),nid:g(r,"nid"),
        loc:[g(r,"gov"),coords].filter(Boolean).join(" — "),coords,
        date:fmtDate(r[COLS.date]||r[COLS.date2]),officer:g(r,"officer"),explain:g(r,"explain"),
        item:g(r,"item"),prop:g(r,"prop"),sev:g(r,"sev"),type:matchType(g(r,"item"))};
    }).filter(r=>r.vno||r.visit);
    if(!out.length){toast("لم أجد عمود «معرف المخالفة» في الملف");return}
    rows=out;LS.set("vv:rows",rows);renderQueue();toast(`تم تحميل ${rows.length} مخالفة`);
  }catch(err){toast("تعذرت قراءة الملف، تأكد أنه ملف إكسل")}
  e.target.value="";
};

/* ===================== قائمة المخالفات ===================== */
let qFilter="all",qSearch="";
function statusOf(id){const a=audits[id];if(!a)return "new";return a.status||"prog"}
const ST={new:["لم يُدقق","b-new"],prog:["قيد التدقيق","b-prog"],ok:["مكتملة","b-ok"],ret:["معادة لمأمور الضبط","b-ret"]};
function renderQueue(){
  const body=$("#queueBody");
  if(!rows.length){
    $("#qCount").textContent="";
    body.innerHTML=`<div class="empty">ارفع ملف المخالفات من أيقونة «ملف المخالفات» بالأعلى، ثم اختر مخالفة لتعبئة النموذج تلقائياً.<br>أو اختر نوع المخالفة من النموذج وعبّئ البيانات يدوياً.</div>`;
    return;
  }
  const counts={all:rows.length,new:0,ret:0,ok:0};rows.forEach(r=>{const s=statusOf(r.vno);if(s==="new"||s==="prog")counts.new++;else counts[s]++});
  $("#qCount").textContent=`${rows.length} مخالفة`;
  const fl=[["all","الكل"],["new","بانتظار التدقيق"],["ret","معادة"],["ok","مكتملة"]];
  const list=rows.filter(r=>{const s=statusOf(r.vno);
    if(qFilter==="new"&&!(s==="new"||s==="prog"))return false;
    if(qFilter==="ret"&&s!=="ret")return false; if(qFilter==="ok"&&s!=="ok")return false;
    if(qSearch){const h=norm([r.vno,r.visit,r.officer,r.item,r.loc,r.name].join(" "));return h.includes(norm(qSearch))||r.vno.toLowerCase().includes(qSearch.toLowerCase())}
    return true});
  body.innerHTML=`<div class="queue-tools"><input class="in" id="qSearch" placeholder="بحث برقم الزيارة أو المأمور أو المحافظة" value="${esc(qSearch)}"></div>
   <div class="pill-row" style="margin-bottom:10px">${fl.map(([k,t])=>`<button type="button" class="pill" data-qf="${k}" aria-pressed="${qFilter===k}">${t} (${counts[k]})</button>`).join("")}</div>
   <div class="queue">${list.length?list.map(r=>{const s=statusOf(r.vno);const t=r.type>=0?GUIDE[r.type].name:(r.item||"بند غير محدد");
     return `<button type="button" class="qrow" data-id="${esc(r.vno)}" aria-current="${current===r.vno}"><span class="id">${esc(r.visit||r.vno)}</span><span class="badge ${ST[s][1]}">${ST[s][0]}</span><span class="t">${esc(t)}</span><span class="m">${esc(r.officer)} — ${esc(r.loc.split(" — ")[0])} — ${esc(r.date)}</span></button>`}).join(""):`<div class="empty">لا توجد مخالفات بهذا التصنيف</div>`}</div>
   <div style="margin-top:8px;text-align:left"><button type="button" class="linkbtn" id="clearRows">إزالة الملف من هذا الجهاز</button></div>`;
  const qs=$("#qSearch");qs.oninput=e=>{qSearch=e.target.value;const pos=e.target.selectionStart;renderQueue();const n=$("#qSearch");n.focus();n.setSelectionRange(pos,pos)};
  $$("[data-qf]").forEach(b=>b.onclick=()=>{qFilter=b.dataset.qf;renderQueue()});
  $$(".qrow").forEach(b=>b.onclick=()=>{openAudit(b.dataset.id);window.scrollTo({top:$("#typeSel").closest("section").offsetTop-8,behavior:"smooth"})});
  $("#clearRows").onclick=()=>{if(confirm("إزالة ملف المخالفات من هذا الجهاز؟ (تبقى نتائج التدقيق المحفوظة)")){rows=[];LS.del("vv:rows");renderQueue()}};
}

  </style>
  <div class="hd"><div><h1>المستند الداعم لتدقيق مخالفة</h1><p>وفق دليل دراسة المخالفات وآلية ضبطها</p></div><div class="stamp">مكتملة المتطلبات<br>${today}</div></div>
  <table class="kv">${row("المخالفة",g.name+(a.cas?" — "+a.cas:""))}${row("التصنيف",g.cat)}${row("رقم الزيارة",f.vno)}${row("المخالف",f.name)}${row("رقم هوية المخالف",f.nid)}${row("رقم جوال المخالف",f.phone)}${row("رقم العداد",f.meter)}${row("الموقع",f.loc)}${row("تاريخ الضبط",f.date)}${row("اسم مأمور الضبط",f.officer)}${row("يتم ضبطها من قبل",g.by)}${row("اسم المدقق",$("#auditor").value)}${row("مرحلة التدقيق",a.stage)}</table>
  <h2>شرح المخالفة من مأمور الضبط</h2><div class="box">${esc(f.explain||"")}</div>
  <h2>نتيجة التحقق من المتطلبات</h2><table>${secs}</table>
  ${(f.gnotes||"").trim()?`<h2>ملاحظات عامة</h2><div class="box">${esc(f.gnotes)}</div>`:""}
  <div class="sig"><div>توقيع المدقق</div><div>الاعتماد</div></div>${attDoc()}</div>`;
}
function openPrint(){
  const m=missingFields();
  if(m.length){toast("أكمل الحقول الإلزامية: "+m.join("، "));return}
  A().status="ok";save();renderQueue();
  $("#sheet").innerHTML=`<h3>المستند الداعم جاهز</h3><div class="sub">اطبعه أو احفظه، ومن نافذة الطباعة اختر «حفظ كـ PDF» لإرفاقه مع مرفقات المخالفة.</div>
  <div class="btns" style="margin-top:14px"><button type="button" class="btn2 pri" id="doPrint">طباعة</button><button type="button" class="btn2" id="doSave" hidden>حفظ المستند كملف</button><button type="button" class="btn2" id="closeSh">إغلاق</button></div>
  <div style="margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:auto;max-height:50vh">${docHTML()}</div>`;
  openSheet();
  $("#doPrint").onclick=()=>{$("#printDoc").innerHTML=docHTML();closeSheet();setTimeout(()=>{try{window.print()}catch(e){toast("الطباعة غير متاحة هنا، استخدم «حفظ المستند كملف»")}},150)};
  $("#closeSh").onclick=closeSheet;
  if(dl){const b=$("#doSave");b.hidden=false;b.onclick=saveDoc}
}
async function saveDoc(){
  const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مستند داعم ${esc(A().f.vno||"")}</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff}.pb{position:fixed;top:10px;left:10px;padding:8px 16px;font:inherit;cursor:pointer}@media print{.pb{display:none}}</style></head><body><button class="pb" onclick="print()">طباعة / حفظ PDF</button>${docHTML()}</body></html>`;
  try{await dl.save({filename:`مستند-داعم-${(A().f.vno||"مخالفة").replace(/[^\w\u0600-\u06FF-]/g,"")}.html`,data:html});toast("تم حفظ المستند")}
  catch(e){if(e&&e.code!=="declined")toast("تعذر حفظ الملف")}
}

/* ===================== أدوات ===================== */
function openSheet(){$("#sheetBg").classList.add("open")}
function closeSheet(){$("#sheetBg").classList.remove("open")}
$("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
async function copy(t){try{await navigator.clipboard.writeText(t);toast("تم النسخ")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("تم النسخ")}catch(_){toast("تعذر النسخ")}ta.remove()}}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}

function renderAll(){
  const a=A();$("#typeSel").value=String(a.type);
  $$("[data-f]").forEach(el=>el.value=a.f[el.dataset.f]||"");
  if(attFor!==current)attCache=[];
  renderStage();explainHint();renderCheck();updateBar();renderQueue();
  loadAtt().then(()=>{if(attFor===current)renderCheck()});
}
let dl=null;
buildTypeSel();
if(current!=="manual"&&!rows.find(r=>r.vno===current)&&!audits[current])current="manual";
renderAll();
